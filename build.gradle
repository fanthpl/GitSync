plugins {
    id 'java'
    id "com.gradleup.shadow" version "9.6.1"
}

group = 'pl.fanth'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }

    // Okaeri Config
    maven { url 'https://repo.okaeri.cloud/releases' }

    // ACF
    maven { url = "https://repo.aikar.co/content/groups/aikar/" }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:26.2.build.92-stable"

    implementation 'eu.okaeri:okaeri-configs-yaml-bukkit:6.1.0-beta.4'
    implementation 'eu.okaeri:okaeri-configs-serdes-commons:6.1.0-beta.4'
    implementation 'eu.okaeri:okaeri-configs-validator-okaeri:6.1.0-beta.4'
    implementation 'eu.okaeri:okaeri-placeholders-bukkit:6.0.0-beta.2'

    implementation "co.aikar:acf-paper:0.5.1-SNAPSHOT"

    implementation("org.eclipse.jgit:org.eclipse.jgit:7.7.1.202607240634-r")

    testImplementation platform('org.junit:junit-bom:6.1.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.14.0'
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveClassifier = ''
    relocate("eu.okaeri", "pl.fanth.gitsync.libs.eu.okaeri")
    relocate("co.aikar.commands", "pl.fanth.gitsync.libs.acf")
    relocate("co.aikar.locales", "pl.fanth.gitsync.libs.locales")
}

assemble.dependsOn(shadowJar)

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ["-parameters"]

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}
